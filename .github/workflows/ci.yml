name: CI & Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for runtime verification)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go (Windows headless-launcher cross-compile)
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Run Core Engine Unit Tests (101 tests)
        run: bun test src/lib

      - name: Run CLI Arguments Tests
        run: bun run test:args

      - name: Build dual-mode distributions
        run: bun run build

      - name: Verify CLI executable runs under Node.js
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":2,"capabilities":{},"info":{"name":"ci-test","version":"1.0"}}}' | node dist/bin.js || true

  publish:
    name: Publish to NPM
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Go (Windows headless-launcher cross-compile)
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install dependencies
        run: bun install

      - name: Build distribution
        run: bun run build
        env:
          # Cross-compile the GUI shim on Linux so published packages ship it.
          AGY_HEADLESS_CROSS: '1'

      - name: Build Windows single-file exe (codex-style, no runtime needed)
        run: bun run build:exe

      - name: Publish to NPM
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dump bridge file-log on failure (wire-e2e triage)
        if: failure()
        run: |
          echo "--- node/bun versions ---"
          node --version; bun --version
          echo "--- bridge file log (/tmp/agy-acp.log) ---"
          cat /tmp/agy-acp.log 2>/dev/null | tail -n 60 || echo "(no bridge log)"
          echo "--- lingering test processes ---"
          ps aux | grep -E "sdk-server|mock-agy" | grep -v grep || echo "(none)"
